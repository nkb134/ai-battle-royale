# Anything that can change a result lives here, and therefore lands in config_hash (§13).

prompt_version: "PROMPT_V1"

match:
  legal_moves_provided: false   # §5.3 — off by default, on purpose
  max_retries: 2
  on_exhausted: "random_legal"  # or "forfeit"
  max_plies: 250                # §5.4 hard cap

pacing:                          # §6.3
  reserve_fraction: 0.10
  min_tokens: 120
  max_tokens: 4000
  panic_fraction: 0.20
  panic_tokens: 250
  critical_fraction: 0.10
  move_tag_headroom: 96          # §6.2 — room for </move> past the thinking budget

adjudicate:                      # §5.4
  resign_cp: -900
  resign_plies: 6
  draw_cp: 50
  draw_plies: 30

analysis:                        # §8.1 — never varies within a rating pool
  depth: 18
  movetime_ms: 200
  threads: 1
  hash_mb: 128

time_controls:                   # §6.4
  quick:    { initial_ms: 600000,  increment_ms: 5000  }
  standard: { initial_ms: 900000,  increment_ms: 10000 }
  long:     { initial_ms: 1800000, increment_ms: 20000 }
  casual:   { initial_ms: null,    increment_ms: 0, token_cap: 3000 }

# tokens_per_sec is measured by `make calibrate`, never guessed (§6.3).
# A null value means uncalibrated: the setup screen must warn (§6.4).
models:
  mock-fast:
    provider: mock
    model_string: "mock-fast-v1"
    display_name: "Mock Fast"
    tokens_per_sec: 120.0
    active: true
  mock-slow:
    provider: mock
    model_string: "mock-slow-v1"
    display_name: "Mock Slow"
    tokens_per_sec: 18.0
    active: true
  mock-drifted:
    provider: mock
    model_string: "mock-drifted-v1"
    display_name: "Mock Drifted"
    # Calibrated at 140, actually generating at 22. This is the §6.3 failure mode:
    # a provider quietly slows down, the pacing controller keeps sizing budgets for
    # the old throughput, and the model runs out of clock. Flag falls come from here.
    tokens_per_sec: 140.0
    actual_tokens_per_sec: 22.0
    active: true

  # --- Vertex AI, probed against the project on 2026-08-21 ---------------
  # tokens_per_sec is null until `make calibrate MODEL=<id>` measures it. The setup
  # screen and the API both refuse an uncalibrated model rather than guess (§6.3).

  gemini-2.5-pro:
    provider: vertex_gemini
    model_string: "gemini-2.5-pro"
    display_name: "Gemini 2.5 Pro"
    thinking: true
    tokens_per_sec: 18.3
    active: true
  gemini-2.5-flash:
    provider: vertex_gemini
    model_string: "gemini-2.5-flash"
    display_name: "Gemini 2.5 Flash"
    thinking: true
    tokens_per_sec: 34.0
    active: true
  gemini-2.5-flash-lite:
    provider: vertex_gemini
    model_string: "gemini-2.5-flash-lite"
    display_name: "Gemini 2.5 Flash Lite"
    # Reports no thinking tokens at all, so its told budget and its enforced budget
    # are the same number. A useful control against the Pro entry above.
    thinking: false
    tokens_per_sec: 152.0
    active: true
  gpt-oss-120b:
    provider: vertex_openai
    model_string: "openai/gpt-oss-120b-maas"
    display_name: "GPT-OSS 120B"
    # Not an OpenAI reasoning-API model: it takes a plain max_tokens cap and returns
    # its chain of thought in reasoning_content.
    reasoning: false
    tokens_per_sec: null
    active: true
  gpt-oss-20b:
    provider: vertex_openai
    model_string: "openai/gpt-oss-20b-maas"
    display_name: "GPT-OSS 20B"
    reasoning: false
    tokens_per_sec: null
    active: true

  # Claude is enabled on Vertex for this project but sits at zero quota: requests
  # return 429 RESOURCE_EXHAUSTED against
  # online_prediction_input_tokens_per_minute_per_base_model. Inactive until a quota
  # increase is granted, not because the adapter is unfinished.
  claude-sonnet-4-5:
    provider: vertex_anthropic
    model_string: "claude-sonnet-4-5@20250929"
    display_name: "Claude Sonnet 4.5"
    location: "global"
    thinking: true
    tokens_per_sec: null
    active: false
  claude-haiku-4-5:
    provider: vertex_anthropic
    model_string: "claude-haiku-4-5@20251001"
    display_name: "Claude Haiku 4.5"
    location: "us-east5"
    thinking: true
    tokens_per_sec: null
    active: false

# Your GCP project does not belong in a public repo. Put it in arena.local.yaml,
# which is gitignored and deep-merged over this file (§16.3).
vertex:
  project: null
  location: "us-central1"

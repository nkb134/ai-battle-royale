[project]
name = "arena"
version = "0.1.0"
description = "Watch two LLMs play chess on a real clock."
requires-python = ">=3.11"
dependencies = [
    "chess>=1.11.1",
    "pyyaml>=6.0.2",
    "anthropic[vertex]>=0.40.0",
    "google-genai>=1.0.0",
    "openai>=1.59.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "websockets>=14.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3.4", "pytest-asyncio>=0.25.0", "ruff>=0.9.0", "black>=24.10.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["arena"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.black]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
